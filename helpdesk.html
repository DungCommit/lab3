<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="Lab3">
  <meta name="keywords" content="HTML">
  <meta name="author" content="DungPham">

  <title>
    Lab 3 assignment
  </title>
</head>

<body>
  <a href="https://www.swinburne.edu.au/" target="_blank"><img src="logo.png"></a>

  <h1>CWA Help Desk Appointment</h1>
  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>
  <form>
    <fieldset>
      <legend>Student details</legend>
      <p>
        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="student-id" pattern="\d{7,10}" required>
      </p>
      <p>
        <label for="given-name">Given Name</label>
        <input type="text" id="given-name" name="given-name" pattern="[a-zA-Z]{1,15}" required>
        <label for="family-name">Family Name</label>
        <input type="text" id="family-name" name="family-name" pattern="[a-zA-Z]{1,15}" required>
      </p>
    </fieldset>
    <fieldset>
      <legend>Your unit</legend>
      <label>
        <input type="radio" name="cos10011" required="required"> COS10011
      </label>
      <label>
        <input type="radio" name="cos60004"> COS60004
      </label>
      <label>
        <input type="radio" name="cos60007"> COS60007
      </label>
      <p>
        <label for="totor">Your tutor</label>
        <select id="tutor" name="tutor" required>
          <option value="">Please Select</option>
          <option value="">John Doe</option>
          <option value="">Jane Doe</option>
          <option value="">Will Smith</option>
        </select>
      </p>
    </fieldset>
    <fieldset>
      <legend>Issue</legend>

      <label for="html">HTML</label>
      <input type="checkbox" id="html" name="category" value="html" checked="checked">

      <label for="css">CSS</label>
      <input type="checkbox" id="css" name="category" value="css">

      <label for="javascript">JavaScript</label>
      <input type="checkbox" id="javascript" name="category" value="javascript">

      <label for="php">PHP</label>
      <input type="checkbox" id="php" name="category" value="php">

      <label for="mysql">MySQL</label>
      <input type="checkbox" id="mysql" name="category" value="mysql">

      <p>
        <label for="description">Description of Issue</label>
        <br>
        <textarea id="description" name="description" rows="5" cols="30"
          placeholder="Write description of your problem here..."></textarea>
      </p>
    </fieldset>
    <fieldset>
      <legend>Preferred Date / Time</legend>
      <label for="date">Date</label>
      <input type="text" id="date" pattern="\d{2}/\d{2}/\d{4}" placeholder="dd/mm/yyyy">
      <br>
      <label for="time">Time</label>
      <input type="text" id="time" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" placeholder="00:00">
    </fieldset>
    <input type="submit" value="Book">
    <input type="submit" value="Reset form">
  </form>

</body>

</html>
